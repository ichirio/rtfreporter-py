[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtfreporter"
version = "0.3.0"
description = "Clinical RTF Reporting Toolkit for Tables, Listings and Figures (Python port)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Yoichi Masui", email = "ichi.r.pro@gmail.com" },
]
keywords = [
    "rtf",
    "clinical",
    "clinical-trials",
    "tables",
    "listings",
    "figures",
    "tfl",
    "reporting",
    "cdisc",
    "biostatistics",
    "pharma",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Text Processing :: Markup",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas"]
polars = ["polars"]
gt = ["great_tables"]
all = ["pandas", "polars", "great_tables"]
dev = [
    "pandas",
    "polars",
    "great_tables",
    "pytest",
    "pytest-cov",
    "ruff",
    "mkdocs-material",
    "mkdocstrings[python]",
]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/ichirio/rtfreporter-py"
Documentation = "https://ichirio.github.io/rtfreporter-py/"
Repository = "https://github.com/ichirio/rtfreporter-py"
Issues = "https://github.com/ichirio/rtfreporter-py/issues"
Changelog = "https://github.com/ichirio/rtfreporter-py/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/rtfreporter"]

[tool.hatch.build.targets.wheel.force-include]
"src/rtfreporter/py.typed" = "rtfreporter/py.typed"

[tool.hatch.build.targets.sdist]
include = [
    "src/rtfreporter",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
    "mkdocs.yml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=rtfreporter --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["rtfreporter"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
