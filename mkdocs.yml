site_name: rtfreporter
site_description: Clinical RTF Reporting Toolkit for Tables, Listings and Figures (Python port)
site_url: https://ichirio.github.io/rtfreporter-py/
repo_url: https://github.com/ichirio/rtfreporter-py
repo_name: ichirio/rtfreporter-py

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              warn_unknown_params: false
              warnings: false
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Differences from R: r-differences.md
  - Articles:
      - Importing tables: importing-tables.md
      - Pagination: pagination.md
      - Borders and rules: borders.md
      - Headers and footers: headers-footers.md
      - Figures: figures.md
      - Styling: styling.md
      - Assembling deliverables: assembling.md
  - API reference: reference.md
